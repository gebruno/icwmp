variables:
  SOURCE_FOLDER: "."
  COMPILATION_FIXUP: "cmake ."

include:
  - project: 'iopsys/gitlab-ci-pipeline'
    file: '/static-code-analysis.yml'
    ref: '1.1'

stages:
    - static_code_analysis
    - pipeline_test

run_unit_test:
   stage: pipeline_test
   image: "${COMMON_IMAGE}"
   allow_failure: false
   script:
   - "./gitlab-ci/install-dependencies.sh"
   - "./gitlab-ci/setup.sh"
   - "./gitlab-ci/unit-test.sh"
   artifacts:
      when: always
      paths:
         - memory-report.xml
         - unit-test-coverage.xml

run_functional_test:
    stage: pipeline_test
    image: "${COMMON_IMAGE}"
    services:
      - name: dev.iopsys.eu:5050/lcm/swmodd/acs:latest
        alias: acs

    allow_failure: false
    script:
    - "./gitlab-ci/install-dependencies.sh"
    - "./gitlab-ci/setup.sh"
    - "./gitlab-ci/functional-api-test.sh"

    artifacts:
        when: always
        reports:
            junit: ./report/tap.xml
        paths:
            - functional-api-result.txt
            - funl-test-coverage.xml
            - funl-test-debug.txt
            - memory-report.xml
            - memory-report-download.xml
            - icwmpd_debug.txt
