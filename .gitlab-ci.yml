variables:
  DEBUG: 'TRUE'
  SOURCE_FOLDER: "./src"
  FLAWFINDER_OPTIONS: "-m 4 --error-level=5"
  CPPCHECK_OPTIONS: " --enable=all --error-exitcode=1 -D_GNU_SOURCE --suppress=unusedFunction -i ./test/ --inline-suppr"

include:
  - project: 'iopsys/gitlab-ci-pipeline'
    file: '/static-code-analysis.yml'
    ref: '0.30'
  - project: 'docs/portal2/pipeline-template'
    file: 'MkDocs.gitlab-ci.yml'
    rules:
       - if: $CI_COMMIT_BRANCH == "devel"

stages:
    - unit_test
    - static_code_analysis
    - functional_test
    - deploy

run_unit_test:
   stage: unit_test
   image: "${COMMON_IMAGE}"
   allow_failure: false
   script:
   - "./gitlab-ci/install-dependencies.sh"
   - "./gitlab-ci/setup.sh"
   - "./gitlab-ci/unit-test.sh"
   artifacts:
      when: always
      paths:
         - memory-report.xml
         - unit-test-coverage.xml

run_api_test:
    stage: functional_test
    image: "${COMMON_IMAGE}"
    services:
      - name: dev.iopsys.eu:5050/lcm/swmodd/acs:latest
        alias: acs
    allow_failure: false
    script:
    - "./gitlab-ci/install-dependencies.sh"
    - "./gitlab-ci/setup.sh"
    - "./gitlab-ci/api-test.sh"

    artifacts:
        when: always
        reports:
            junit: ./report/tap.xml
        paths:
            - api-test-coverage.xml
            - memory-report.xml
            - api-test-result.log

run_functional_test:
    stage: functional_test
    image: "${COMMON_IMAGE}"
    services:
      - name: dev.iopsys.eu:5050/lcm/swmodd/acs:latest
        alias: acs

    allow_failure: false
    script:
    - "./gitlab-ci/install-dependencies.sh"
    - "./gitlab-ci/setup.sh"
    - "./gitlab-ci/functional-test.sh"

    artifacts:
        when: always
        reports:
            junit: ./report/tap.xml
        paths:
            - funl-test-coverage.xml
            - funl-test-result.log
            - funl-test-debug.log
            - memory-report.xml
            - memory-report-download.xml
            - icwmpd_debug.txt
